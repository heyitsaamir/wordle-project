<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word Game - Share Result Preview</title>
    <style>
      :root {
        --success: hsl(150deg 70% 30%);
        --warning: hsl(50deg 100% 30%);
        --incorrect: hsl(0deg 0% 25%);
        --border: hsl(0deg 0% 75%);
        --text: hsl(0deg 0% 10%);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      * {
        margin: 0;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        color: var(--text);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        line-height: 1.5;
      }

      button {
        margin: 0;
        border: 0;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 4rem;
        border-bottom: 1px solid var(--border);
      }

      h1 {
        font-size: 2rem;
      }

      .game-wrapper {
        width: min(100%, 500px);
        margin: 0 auto;
        padding: 32px;
      }

      .guess-results {
        display: grid;
        gap: 4px;
      }

      .guess {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 4px;
      }

      .cell {
        display: grid;
        place-content: center;
        aspect-ratio: 1;
        border: 2px solid var(--border);
        border-radius: 3px;
        color: white;
        font-size: 2rem;
        font-weight: 700;
      }

      .correct {
        border-color: var(--success);
        background: var(--success);
      }

      .misplaced {
        border-color: var(--warning);
        background: var(--warning);
      }

      .incorrect {
        border-color: var(--incorrect);
        background: var(--incorrect);
      }

      .banner {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 1;
        display: grid;
        justify-items: center;
        gap: 16px;
        width: 100%;
        max-width: 520px;
        margin: 0 auto;
        padding: 24px 32px 20px;
        border-radius: 16px 16px 0 0;
        background: var(--success);
        box-shadow: 0 -12px 40px hsl(0deg 0% 0% / 20%);
        color: white;
        text-align: center;
        animation: slide-up 750ms cubic-bezier(0, 0.72, 0.24, 1.02);
      }

      .banner h2 {
        font-size: 1.5rem;
      }

      .result-grid {
        display: grid;
        gap: 4px;
        width: 152px;
      }

      .result-row {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 4px;
      }

      .result-cell {
        aspect-ratio: 1;
        border: 1px solid hsl(0deg 0% 100% / 50%);
        border-radius: 3px;
      }

      .result-actions {
        display: grid;
        grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
        gap: 10px;
        width: min(100%, 360px);
      }

      .result-actions button {
        min-height: 48px;
        padding: 10px 18px;
        border: 2px solid white;
        border-radius: 999px;
        font-weight: 700;
      }

      .share-button {
        background: white;
        color: hsl(0deg 0% 15%);
      }

      .play-again-button {
        background: transparent;
      }

      .share-button:hover {
        background: hsl(0deg 0% 94%);
      }

      .play-again-button:hover {
        background: hsl(0deg 0% 100% / 12%);
      }

      .result-actions button:focus-visible {
        outline: 3px solid white;
        outline-offset: 3px;
      }

      .share-feedback {
        min-height: 1.5em;
        font-size: 0.875rem;
        font-weight: 700;
      }

      @media (max-width: 32rem) {
        h1 {
          font-size: 1.5rem;
        }

        .game-wrapper {
          padding: 20px;
        }

        .banner {
          padding-right: 20px;
          padding-left: 20px;
        }
      }

      @keyframes slide-up {
        from {
          transform: translateY(100%);
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Word Game</h1>
    </header>

    <main class="game-wrapper">
      <div class="guess-results" aria-label="Completed game board">
        <div class="guess">
          <span class="cell incorrect">R</span>
          <span class="cell misplaced">A</span>
          <span class="cell misplaced">T</span>
          <span class="cell incorrect">E</span>
          <span class="cell incorrect">S</span>
        </div>
        <div class="guess">
          <span class="cell correct">A</span>
          <span class="cell correct">B</span>
          <span class="cell correct">O</span>
          <span class="cell incorrect">V</span>
          <span class="cell incorrect">E</span>
        </div>
        <div class="guess">
          <span class="cell correct">A</span>
          <span class="cell correct">B</span>
          <span class="cell correct">O</span>
          <span class="cell correct">U</span>
          <span class="cell correct">T</span>
        </div>
        <div class="guess" aria-hidden="true">
          <span class="cell"></span><span class="cell"></span>
          <span class="cell"></span><span class="cell"></span>
          <span class="cell"></span>
        </div>
        <div class="guess" aria-hidden="true">
          <span class="cell"></span><span class="cell"></span>
          <span class="cell"></span><span class="cell"></span>
          <span class="cell"></span>
        </div>
        <div class="guess" aria-hidden="true">
          <span class="cell"></span><span class="cell"></span>
          <span class="cell"></span><span class="cell"></span>
          <span class="cell"></span>
        </div>
      </div>
    </main>

    <section class="banner" aria-labelledby="result-heading">
      <div>
        <h2 id="result-heading">Nice work!</h2>
        <p>Solved in <strong>3 guesses</strong>.</p>
      </div>

      <div class="result-grid" aria-label="Your guess result">
        <div class="result-row" aria-label="Guess 1">
          <span class="result-cell incorrect"></span>
          <span class="result-cell misplaced"></span>
          <span class="result-cell misplaced"></span>
          <span class="result-cell incorrect"></span>
          <span class="result-cell incorrect"></span>
        </div>
        <div class="result-row" aria-label="Guess 2">
          <span class="result-cell correct"></span>
          <span class="result-cell correct"></span>
          <span class="result-cell correct"></span>
          <span class="result-cell incorrect"></span>
          <span class="result-cell incorrect"></span>
        </div>
        <div class="result-row" aria-label="Guess 3">
          <span class="result-cell correct"></span>
          <span class="result-cell correct"></span>
          <span class="result-cell correct"></span>
          <span class="result-cell correct"></span>
          <span class="result-cell correct"></span>
        </div>
      </div>

      <div class="result-actions">
        <button class="share-button" type="button">Share result</button>
        <button class="play-again-button" type="button">Play again</button>
      </div>

      <p class="share-feedback" aria-live="polite"></p>
    </section>

    <script>
      const shareButton = document.querySelector(".share-button");
      const playAgainButton = document.querySelector(".play-again-button");
      const feedback = document.querySelector(".share-feedback");
      const banner = document.querySelector(".banner");
      const shareText =
        "Word Game 3/6\n\n⬛🟨🟨⬛⬛\n🟩🟩🟩⬛⬛\n🟩🟩🟩🟩🟩\n\nCan you beat my result?";

      shareButton.addEventListener("click", async () => {
        feedback.textContent = "";
        const url = new URL("../", window.location.href).href;

        if (navigator.share) {
          try {
            await navigator.share({
              title: "Word Game result",
              text: shareText,
              url,
            });
            feedback.textContent = "Result shared!";
            return;
          } catch (error) {
            if (error.name === "AbortError") {
              return;
            }
          }
        }

        try {
          await navigator.clipboard.writeText(`${shareText}\n${url}`);
          feedback.textContent = "Result copied. Send it to a friend!";
        } catch (error) {
          feedback.textContent = "Sharing is unavailable in this browser.";
        }
      });

      playAgainButton.addEventListener("click", () => {
        banner.hidden = true;
      });
    </script>
  </body>
</html>
